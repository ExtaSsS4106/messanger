{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Месседжер - Главная</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap');

        :root {
            --bg: #f1f6ff;
            --bg-gradient: radial-gradient(1200px 700px at 10% 10%, #ffffff 0%, #f1f6ff 45%, #e7f0ff 100%);
            --panel: #ffffff;
            --panel-2: #eef3ff;
            --panel-3: #dde8ff;
            --text: #0b1633;
            --muted: #66739a;
            --accent: #1f66ff;
            --accent-2: #1547b6;
            --danger: #ff3b5c;
            --shadow: 0 10px 24px rgba(8, 18, 43, 0.12);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: "Space Grotesk", "Segoe UI", Roboto, Arial, sans-serif;
            background: var(--bg-gradient);
            color: var(--text);
            height: 100vh;
        }

        body.dark-theme {
            --bg: #0b1220;
            --bg-gradient: radial-gradient(1200px 700px at 10% 10%, #121a2c 0%, #0b1220 55%, #08101d 100%);
            --panel: #101a2f;
            --panel-2: #14203a;
            --panel-3: #1b2b4c;
            --text: #e7ecff;
            --muted: #a6b3d8;
            --accent: #5b8bff;
            --accent-2: #3d6be3;
            --danger: #ff5b7a;
            --shadow: 0 12px 28px rgba(0, 0, 0, 0.35);
        }
        
        .container {
            display: grid;
            grid-template-columns: 330px 1fr;
            gap: 16px;
            height: 100vh;
            padding: 16px;
        }
        
        /* Левая панель */
        .left-panel {
            background: var(--panel);
            display: flex;
            flex-direction: column;
            border-radius: 18px;
            box-shadow: var(--shadow);
            overflow: hidden;
            border: 1px solid #e6edff;
        }
        
        .search-box {
            padding: 16px 16px 10px 16px;
        }
        
        .search-box input {
            width: 100%;
            padding: 11px 14px;
            border-radius: 12px;
            border: 1px solid transparent;
            outline: none;
            background: var(--panel-2);
            color: var(--text);
            transition: border 0.2s, background 0.2s, box-shadow 0.2s;
        }

        .search-box input:focus {
            border-color: var(--accent);
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(31, 102, 255, 0.12);
        }
        
        .tabs {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            padding: 6px;
            margin: 0 12px 8px 12px;
            background: var(--panel-2);
            border-radius: 12px;
        }
        
        .tab {
            cursor: pointer;
            padding: 8px 6px;
            border-radius: 10px;
            color: var(--muted);
            font-weight: 600;
            font-size: 13px;
            text-align: center;
            transition: background 0.2s, color 0.2s, transform 0.2s;
        }
        
        .tab.active {
            background: #ffffff;
            color: var(--accent);
            transform: translateY(-1px);
            box-shadow: 0 6px 12px rgba(31, 102, 255, 0.15);
        }
        
        .user-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px 10px 10px 10px;
        }
        
        .user-item {
            display: grid;
            grid-template-columns: 44px 1fr auto;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            cursor: pointer;
            border-radius: 12px;
            margin: 6px 0;
            background: var(--panel-2);
            border: 1px solid transparent;
            transition: background 0.2s, border 0.2s, transform 0.2s, box-shadow 0.2s;
            position: relative;
        }
        
        .user-item:hover {
            background: var(--panel-3);
            border-color: #c9d9ff;
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(21, 40, 94, 0.08);
        }
        
        .user-item.active {
            background: var(--accent);
            color: #ffffff;
            border-color: transparent;
            box-shadow: 0 10px 20px rgba(31, 102, 255, 0.3);
        }
        
        .user-avatar {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            background: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: #ffffff;
            flex-shrink: 0;
        }
        
        .user-info {
            min-width: 0;
        }
        
        .user-name {
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .last-message {
            font-size: 12px;
            color: var(--muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .message-file-icon {
            font-size: 10px;
            margin-right: 3px;
        }
        
        .unread-badge {
            background: #ffffff;
            color: var(--accent);
            border-radius: 999px;
            min-width: 22px;
            height: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 700;
            margin-left: 5px;
            padding: 0 6px;
        }
        
        /* Кнопки удаления */
        .delete-btn {
            background: var(--danger);
            color: white;
            border: none;
            border-radius: 999px;
            width: 26px;
            height: 26px;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.2s, transform 0.2s;
        }
        
        .delete-btn:hover {
            transform: scale(1.08);
        }
        
        .user-item:hover .delete-btn {
            opacity: 1;
        }
        
        .actions {
            display: grid;
            gap: 10px;
            margin: 10px 12px 12px 12px;
            margin-top: auto;
        }
        
        .actions a {
            text-decoration: none;
        }
        
        .actions button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s, opacity 0.2s;
        }
        
        .actions button:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 16px rgba(21, 40, 94, 0.14);
        }
        
        .actions button.green {
            background: var(--accent);
            color: #ffffff;
        }
        
        .actions button.gray {
            background: var(--panel-2);
            color: var(--text);
            border: 1px solid #dbe6ff;
        }
        
        /* Правая панель */
        .right-panel {
            display: flex;
            flex-direction: column;
            background: var(--panel);
            border-radius: 18px;
            box-shadow: var(--shadow);
            overflow: hidden;
            border: 1px solid #e6edff;
        }
        
        .chat-header {
            padding: 16px 18px;
            background: linear-gradient(90deg, var(--panel) 0%, var(--panel-2) 100%);
            font-weight: 600;
            font-size: 18px;
            border-bottom: 1px solid var(--panel-3);
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 2;
        }
        
        .chat-header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .chat-header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            position: relative;
        }
        
        .invite-btn {
            background: var(--panel-2);
            color: var(--accent);
            border: 1px solid #dbe6ff;
            border-radius: 999px;
            padding: 6px 12px;
            font-size: 13px;
            cursor: pointer;
            transition: background 0.2s, color 0.2s, transform 0.2s;
        }
        
        .invite-btn:hover {
            background: var(--accent);
            color: #ffffff;
            transform: translateY(-1px);
        }
        
        .invite-btn:active {
            transform: translateY(1px);
        }
        
        .chat-delete-btn {
            background: var(--danger);
            color: white;
            border: none;
            border-radius: 999px;
            padding: 6px 12px;
            font-size: 13px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        .chat-delete-btn:hover {
            transform: translateY(-1px);
        }

        .settings-btn {
            background: var(--panel-2);
            color: var(--text);
            border: 1px solid var(--panel-3);
            border-radius: 999px;
            padding: 6px 12px;
            font-size: 13px;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .settings-btn:hover {
            transform: translateY(-1px);
            background: var(--panel-3);
        }

        .settings-menu {
            position: absolute;
            right: 0;
            top: 40px;
            background: var(--panel);
            border: 1px solid var(--panel-3);
            box-shadow: var(--shadow);
            border-radius: 12px;
            padding: 8px;
            width: 200px;
            display: none;
            z-index: 5;
        }

        .settings-menu.show {
            display: block;
        }

        .settings-menu button,
        .settings-menu a {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            border: none;
            background: transparent;
            color: var(--text);
            padding: 10px 10px;
            border-radius: 8px;
            font-size: 14px;
            text-decoration: none;
            cursor: pointer;
        }

        .settings-menu button:hover,
        .settings-menu a:hover {
            background: var(--panel-2);
        }
        
        .messages {
            flex: 1;
            padding: 22px 18px 8px 18px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            background: linear-gradient(180deg, var(--panel-2) 0%, var(--panel-3) 100%);
        }
        
        .message {
            max-width: 72%;
            padding: 10px 14px;
            border-radius: 16px;
            word-wrap: break-word;
            position: relative;
            box-shadow: 0 10px 20px rgba(8, 18, 43, 0.08);
        }
        
        .message.sent {
            background: var(--accent);
            color: #ffffff;
            align-self: flex-end;
        }
        
        .message.received {
            background: var(--panel);
            color: var(--text);
            align-self: flex-start;
            border: 1px solid var(--panel-3);
        }
        
        .message .username {
            font-size: 11px;
            font-weight: 600;
            margin-bottom: 3px;
            color: var(--muted);
        }
        
        .message .time {
            font-size: 10px;
            margin-top: 3px;
            opacity: 0.7;
            text-align: right;
        }
        
        /* Файлы в сообщениях */
        .message-file {
            margin: 6px 0 2px 0;
            padding: 8px 12px;
            background: rgba(31, 102, 255, 0.12);
            border-radius: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .message-file.sent {
            background: rgba(255, 255, 255, 0.2);
        }
        
        .message-file a {
            color: inherit;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
        }
        
        .message-file a:hover {
            text-decoration: underline;
        }
        
        .file-icon {
            font-size: 20px;
        }
        
        .file-info {
            flex: 1;
        }
        
        .file-name {
            font-weight: 600;
            font-size: 13px;
            word-break: break-all;
        }
        
        .file-size {
            font-size: 11px;
            opacity: 0.7;
        }
        
        .empty-state {
            text-align: center;
            color: var(--muted);
            padding: 40px;
            font-size: 16px;
        }
        
        /* Область ввода */
        .input-area {
            display: flex;
            padding: 14px 16px;
            background: var(--panel);
            gap: 10px;
            align-items: center;
            border-top: 1px solid var(--panel-3);
            position: sticky;
            bottom: 0;
            z-index: 2;
        }
        
        .input-area input[type="text"] {
            flex: 1;
            padding: 12px 14px;
            border-radius: 999px;
            border: 1px solid var(--panel-3);
            outline: none;
            background: var(--panel-2);
            color: var(--text);
            transition: border 0.2s, background 0.2s, box-shadow 0.2s;
        }
        
        .input-area input[type="text"]::placeholder {
            color: var(--muted);
        }

        .input-area input[type="text"]:focus {
            background: var(--panel);
            border-color: var(--accent);
            box-shadow: 0 0 0 4px rgba(31, 102, 255, 0.12);
        }
        
        .attach-button {
            width: 42px;
            height: 42px;
            border-radius: 999px;
            border: 1px solid var(--panel-3);
            background: var(--panel-2);
            color: var(--text);
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        
        .attach-button:hover {
            background: var(--panel);
            transform: translateY(-1px);
            box-shadow: 0 8px 14px rgba(8, 18, 43, 0.08);
        }
        
        .send-button {
            width: 50px;
            height: 50px;
            border-radius: 999px;
            border: none;
            background: var(--accent);
            color: #ffffff;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .send-button:hover {
            transform: translateY(-1px);
            box-shadow: 0 12px 18px rgba(31, 102, 255, 0.25);
        }
        
        .send-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        
        /* Прогресс загрузки */
        .upload-progress {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: var(--panel);
            border-radius: 12px;
            padding: 14px;
            box-shadow: var(--shadow);
            min-width: 250px;
            z-index: 1000;
            animation: slideIn 0.3s ease;
        }
        
        .progress-bar {
            width: 100%;
            height: 6px;
            background: var(--panel-3);
            border-radius: 999px;
            margin: 10px 0;
            overflow: hidden;
        }
        
        .progress-fill {
            height: 100%;
            background: var(--accent);
            transition: width 0.3s ease;
        }
        
        .progress-text {
            font-size: 12px;
            color: var(--muted);
            text-align: right;
        }
        
        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
        
        /* Предпросмотр файла */
        .file-preview {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: var(--panel);
            border-radius: 14px;
            padding: 20px;
            box-shadow: 0 18px 40px rgba(8, 18, 43, 0.35);
            z-index: 1001;
            max-width: 520px;
            width: 92%;
        }
        
        .preview-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .preview-close {
            background: none;
            border: none;
            color: var(--text);
            font-size: 20px;
            cursor: pointer;
        }
        
        .preview-image {
            max-width: 100%;
            max-height: 320px;
            border-radius: 10px;
        }
        
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(9, 14, 28, 0.6);
            z-index: 1000;
            backdrop-filter: blur(3px);
        }

        .btn-primary, .btn-secondary {
            border: none;
            border-radius: 10px;
            padding: 10px 14px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-primary {
            background: var(--accent);
            color: #ffffff;
        }

        .btn-secondary {
            background: var(--panel-2);
            color: var(--text);
            border: 1px solid var(--panel-3);
        }
        
        /* Анимации */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .user-item {
            animation: fadeIn 0.3s ease;
        }

        @media (max-width: 980px) {
            .container {
                grid-template-columns: 1fr;
                grid-template-rows: 44vh 1fr;
            }

            .left-panel {
                height: 44vh;
            }

            .right-panel {
                height: 56vh;
            }

            .actions {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Левая панель -->
        <div class="left-panel">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Поиск..." onkeyup="searchUsers()">
            </div>
            <div class="tabs">
                <div class="tab active" id="chatsTab" onclick="switchTab('chats')">Чаты</div>
                <div class="tab" id="friendsTab" onclick="switchTab('friends')">Друзья</div>
                <div class="tab" id="requestsTab" onclick="switchTab('requests')">Запросы</div>
            </div>
            <div class="user-list" id="userList"></div>
            <div class="actions">
                <a href="{% url 'create_group_chat' %}">
                    <button class="green">Создать канал</button>
                </a>
                <a href="{% url 'add_friend' %}">
                    <button class="gray">Добавить в друзья</button>
                </a>
            </div>
        </div>
        
        <!-- Правая панель -->
        <div class="right-panel">
            <div class="chat-header">
                <div class="chat-header-left">
                    <span id="chatUserName">Выберите чат</span>
                    <button class="invite-btn" id="inviteBtn" onclick="createInvite()" style="display: none;">
                        🔗 Пригласить
                    </button>
                </div>
                <div class="chat-header-actions">
                    <button class="settings-btn" id="settingsBtn" type="button" onclick="toggleSettingsMenu(event)">
                        ⚙ Настройки
                    </button>
                    <div class="settings-menu" id="settingsMenu" onclick="event.stopPropagation()">
                        <a href="{% url 'profile' %}">Профиль</a>
                        <button type="button" id="themeToggleBtn" onclick="toggleTheme()">Темная тема</button>
                        <a href="{% url 'logout' %}?next=/login">Выйти</a>
                    </div>
                    <button class="chat-delete-btn" id="deleteChatBtn" onclick="deleteCurrentChat()" style="display: none;">
                        Удалить чат
                    </button>
                </div>
            </div>
            <div class="messages" id="messagesContainer">
                <div class="empty-state">
                    Выберите чат, чтобы начать общение
                </div>
            </div>
            <div class="input-area">
                <input type="text" id="messageInput" placeholder="Сообщение" onkeypress="checkEnter(event)">
                
                <!-- Скрытый input для файлов -->
                <input type="file" id="fileInput" style="display: none" onchange="handleFileSelect(event)">
                
                <!-- Кнопка прикрепления файла -->
                <button class="attach-button" onclick="document.getElementById('fileInput').click()" id="attachBtn">
                    📎
                </button>
                
                <!-- Кнопка отправки -->
                <button class="send-button" onclick="sendMessage()" id="sendButton" disabled>
                    →
                </button>
            </div>
        </div>
    </div>
    
    <!-- Контейнер для прогресса загрузки -->
    <div id="progressContainer"></div>
    
    <!-- Контейнер для предпросмотра -->
    <div id="previewContainer"></div>

    <script>
        let currentUserId = {{ request.user.id }};
        let currentChatId = null;
        let currentChatName = '';
        let currentChatType = null;
        let refreshInterval = null;
        let selectedFile = null;

        // Темы
        function updateThemeToggleText() {
            const btn = document.getElementById('themeToggleBtn');
            if (!btn) return;
            btn.textContent = document.body.classList.contains('dark-theme') ? 'Светлая тема' : 'Темная тема';
        }

        function setTheme(mode) {
            document.body.classList.toggle('dark-theme', mode === 'dark');
            localStorage.setItem('theme', mode);
            updateThemeToggleText();
        }

        function getPreferredTheme() {
            const saved = localStorage.getItem('theme');
            if (saved) return saved;
            if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                return 'dark';
            }
            return 'light';
        }

        function toggleTheme() {
            const isDark = document.body.classList.contains('dark-theme');
            setTheme(isDark ? 'light' : 'dark');
        }

        // Меню настроек
        function toggleSettingsMenu(event) {
            if (event) event.stopPropagation();
            const menu = document.getElementById('settingsMenu');
            if (!menu) return;
            menu.classList.toggle('show');
        }
        
        // Получение CSRF токена
        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }
        
        // Форматирование размера файла
        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }
        
        // Получение иконки для файла
        function getFileIcon(filename) {
            const ext = filename.split('.').pop().toLowerCase();
            const icons = {
                'jpg': '🖼️', 'jpeg': '🖼️', 'png': '🖼️', 'gif': '🖼️', 'bmp': '🖼️',
                'pdf': '📄', 'doc': '📝', 'docx': '📝', 'txt': '📃',
                'mp3': '🎵', 'wav': '🎵', 'ogg': '🎵',
                'mp4': '🎥', 'avi': '🎥', 'mov': '🎥',
                'zip': '📦', 'rar': '📦', '7z': '📦',
                'xls': '📊', 'xlsx': '📊', 'csv': '📊',
                'ppt': '📽️', 'pptx': '📽️'
            };
            return icons[ext] || '📎';
        }
        
        // Обработка выбора файла
        function handleFileSelect(event) {
            selectedFile = event.target.files[0];
            if (selectedFile) {
                if (selectedFile.type.startsWith('image/')) {
                    showImagePreview(selectedFile);
                } else {
                    showFilePreview(selectedFile);
                }
            }
        }
        
        // Показ предпросмотра изображения
        function showImagePreview(file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const previewHTML = `
                    <div class="overlay" onclick="closePreview()"></div>
                    <div class="file-preview">
                        <div class="preview-header">
                            <h3>Предпросмотр</h3>
                            <button class="preview-close" onclick="closePreview()">✕</button>
                        </div>
                        <img src="${e.target.result}" class="preview-image" alt="Preview">
                        <div style="margin-top: 15px; display: flex; gap: 10px; justify-content: flex-end;">
                            <button class="btn-secondary" onclick="closePreview()">Отмена</button>
                            <button class="btn-primary" onclick="sendFileMessage()">Отправить</button>
                        </div>
                    </div>
                `;
                document.getElementById('previewContainer').innerHTML = previewHTML;
            };
            reader.readAsDataURL(file);
        }
        
        // Показ предпросмотра файла
        function showFilePreview(file) {
            const previewHTML = `
                <div class="overlay" onclick="closePreview()"></div>
                <div class="file-preview">
                    <div class="preview-header">
                        <h3>Файл для отправки</h3>
                        <button class="preview-close" onclick="closePreview()">✕</button>
                    </div>
                    <div style="text-align: center; padding: 20px;">
                        <div style="font-size: 48px; margin-bottom: 10px;">${getFileIcon(file.name)}</div>
                        <div style="font-weight: bold; margin-bottom: 5px;">${file.name}</div>
                        <div style="color: #6b7a99; font-size: 12px; margin-bottom: 20px;">${formatFileSize(file.size)}</div>
                        <div style="display: flex; gap: 10px; justify-content: center;">
                            <button class="btn-secondary" onclick="closePreview()">Отмена</button>
                            <button class="btn-primary" onclick="sendFileMessage()">Отправить</button>
                        </div>
                    </div>
                </div>
            `;
            document.getElementById('previewContainer').innerHTML = previewHTML;
        }
        
        // Закрыть предпросмотр
        function closePreview() {
            document.getElementById('previewContainer').innerHTML = '';
            document.getElementById('fileInput').value = '';
            selectedFile = null;
        }
        
        // Показ прогресса загрузки
        function showProgress(percent) {
            const progressHTML = `
                <div class="upload-progress" id="uploadProgress">
                    <div style="display: flex; justify-content: space-between;">
                        <span>Загрузка...</span>
                        <span>${Math.round(percent)}%</span>
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: ${percent}%"></div>
                    </div>
                </div>
            `;
            document.getElementById('progressContainer').innerHTML = progressHTML;
        }
        
        // Скрыть прогресс
        function hideProgress() {
            document.getElementById('progressContainer').innerHTML = '';
        }
        
        // Отправка файла
        function sendFileMessage() {
            if (!selectedFile || !currentChatId) {
                closePreview();
                return;
            }
            
            closePreview();
            showProgress(0);
            
            const formData = new FormData();
            formData.append('file', selectedFile);
            formData.append('text', '');
            
            const xhr = new XMLHttpRequest();
            
            xhr.upload.addEventListener('progress', function(e) {
                if (e.lengthComputable) {
                    const percent = (e.loaded / e.total) * 100;
                    showProgress(percent);
                }
            });
            
            xhr.addEventListener('load', function() {
                hideProgress();
                if (xhr.status === 201) {
                    document.getElementById('fileInput').value = '';
                    selectedFile = null;
                    loadMessages(currentChatId);
                    loadChats();
                } else {
                    alert('Ошибка при отправке файла');
                }
            });
            
            xhr.addEventListener('error', function() {
                hideProgress();
                alert('Ошибка при отправке файла');
            });
            
            xhr.open('POST', `/api/chats/${currentChatId}/send/`, true);
            xhr.setRequestHeader('X-CSRFToken', getCookie('csrftoken'));
            xhr.send(formData);
        }
        
        // Отправка сообщения
        function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            
            if (!currentChatId) return;
            
            if (selectedFile) {
                sendFileMessage();
                return;
            }
            
            if (!text) return;
            
            fetch(`/api/chats/${currentChatId}/send/`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCookie('csrftoken')
                },
                body: JSON.stringify({text: text})
            })
            .then(response => response.json())
            .then(() => {
                input.value = '';
                loadMessages(currentChatId);
                loadChats();
            })
            .catch(error => {
                console.error('Error sending message:', error);
            });
        }
        
        // Загрузка чатов с кнопками удаления
        function loadChats() {
            fetch('/api/chats/')
                .then(response => response.json())
                .then(chats => {
                    const container = document.getElementById('userList');
                    container.innerHTML = '';
                    
                    if (chats.length === 0) {
                        container.innerHTML = '<div class="empty-state">Нет чатов</div>';
                        return;
                    }
                    
                    chats.forEach(chat => {
                        const div = document.createElement('div');
                        div.className = 'user-item' + (chat.id === currentChatId ? ' active' : '');
                        div.dataset.chatId = chat.id;
                        div.dataset.chatType = chat.type;
                        
                        const avatar = document.createElement('div');
                        avatar.className = 'user-avatar';
                        avatar.textContent = chat.chat_name ? chat.chat_name[0].toUpperCase() : '?';
                        
                        const info = document.createElement('div');
                        info.className = 'user-info';
                        
                        const name = document.createElement('div');
                        name.className = 'user-name';
                        name.textContent = chat.chat_name;
                        
                        const lastMsg = document.createElement('div');
                        lastMsg.className = 'last-message';
                        
                        if (chat.last_message) {
                            if (chat.last_message.type === 'file') {
                                lastMsg.innerHTML = `📎 ${chat.last_message.text || 'Файл'}`;
                            } else {
                                lastMsg.textContent = `${chat.last_message.username}: ${chat.last_message.text}`;
                            }
                        } else {
                            lastMsg.textContent = 'Нет сообщений';
                        }
                        
                        info.appendChild(name);
                        info.appendChild(lastMsg);
                        
                        div.appendChild(avatar);
                        div.appendChild(info);
                        
                        if (chat.unread_count > 0) {
                            const badge = document.createElement('div');
                            badge.className = 'unread-badge';
                            badge.textContent = chat.unread_count;
                            div.appendChild(badge);
                        }
                        
                        // Кнопка удаления чата
                        const deleteBtn = document.createElement('button');
                        deleteBtn.className = 'delete-btn';
                        deleteBtn.innerHTML = '✕';
                        deleteBtn.onclick = (e) => {
                            e.stopPropagation();
                            deleteChat(chat.id, chat.chat_name);
                        };
                        div.appendChild(deleteBtn);
                        
                        div.onclick = (e) => selectChat(chat.id, chat.chat_name, chat.type);
                        container.appendChild(div);
                    });
                })
                .catch(error => {
                    console.error('Error loading chats:', error);
                });
        }
        
        // Загрузка сообщений
        function loadMessages(chatId) {
            fetch(`/api/chats/${chatId}/messages/`)
                .then(response => response.json())
                .then(messages => {
                    const container = document.getElementById('messagesContainer');
                    container.innerHTML = '';
                    
                    if (messages.length === 0) {
                        container.innerHTML = '<div class="empty-state">Нет сообщений</div>';
                        return;
                    }
                    
                    messages.forEach(msg => {
                        const div = document.createElement('div');
                        div.className = 'message ' + (msg.user_id === currentUserId ? 'sent' : 'received');
                        
                        if (msg.user_id !== currentUserId) {
                            const username = document.createElement('div');
                            username.className = 'username';
                            username.textContent = msg.username;
                            div.appendChild(username);
                        }
                        
                        if (msg.text && msg.type !== 'file') {
                            const text = document.createElement('div');
                            text.textContent = msg.text;
                            div.appendChild(text);
                        }
                        
                        if (msg.file_url) {
                            const fileDiv = document.createElement('div');
                            fileDiv.className = 'message-file ' + (msg.user_id === currentUserId ? 'sent' : '');
                            
                            const link = document.createElement('a');
                            link.href = msg.file_url;
                            link.target = '_blank';
                            
                            const icon = document.createElement('span');
                            icon.className = 'file-icon';
                            icon.textContent = getFileIcon(msg.file_name || 'file');
                            
                            const info = document.createElement('span');
                            info.className = 'file-info';
                            
                            const name = document.createElement('div');
                            name.className = 'file-name';
                            name.textContent = msg.file_name || 'Файл';
                            
                            const size = document.createElement('div');
                            size.className = 'file-size';
                            size.textContent = msg.file_size ? formatFileSize(msg.file_size) : '';
                            
                            info.appendChild(name);
                            info.appendChild(size);
                            
                            link.appendChild(icon);
                            link.appendChild(info);
                            fileDiv.appendChild(link);
                            div.appendChild(fileDiv);
                        }
                        
                        const time = document.createElement('div');
                        time.className = 'time';
                        time.textContent = new Date(msg.created_at).toLocaleTimeString();
                        div.appendChild(time);
                        
                        container.appendChild(div);
                    });
                    
                    container.scrollTop = container.scrollHeight;
                })
                .catch(error => {
                    console.error('Error loading messages:', error);
                });
        }
        
        // Загрузка друзей
        function loadFriends() {
            fetch('/api/friends/')
                .then(response => response.json())
                .then(friends => {
                    const container = document.getElementById('userList');
                    container.innerHTML = '';
                    
                    if (friends.length === 0) {
                        container.innerHTML = '<div class="empty-state">Нет друзей</div>';
                        return;
                    }
                    
                    friends.forEach(friend => {
                        const div = document.createElement('div');
                        div.className = 'user-item';
                        
                        const avatar = document.createElement('div');
                        avatar.className = 'user-avatar';
                        avatar.textContent = friend.username[0].toUpperCase();
                        
                        const info = document.createElement('div');
                        info.className = 'user-info';
                        
                        const name = document.createElement('div');
                        name.className = 'user-name';
                        name.textContent = friend.username;
                        
                        info.appendChild(name);
                        
                        div.appendChild(avatar);
                        div.appendChild(info);
                        
                        const deleteBtn = document.createElement('button');
                        deleteBtn.className = 'delete-btn';
                        deleteBtn.innerHTML = '✕';
                        deleteBtn.onclick = (e) => {
                            e.stopPropagation();
                            removeFriend(friend.id, friend.username);
                        };
                        div.appendChild(deleteBtn);
                        
                        div.onclick = () => openPrivateChat(friend.id);
                        
                        container.appendChild(div);
                    });
                })
                .catch(error => {
                    console.error('Error loading friends:', error);
                });
        }
        
        // Загрузка заявок в друзья
        function loadFriendRequests() {
            fetch('/api/friend-requests/')
                .then(response => response.json())
                .then(requests => {
                    const container = document.getElementById('userList');
                    container.innerHTML = '';
                    
                    if (requests.length === 0) {
                        container.innerHTML = '<div class="empty-state">Нет заявок</div>';
                        return;
                    }
                    
                    requests.forEach(req => {
                        const div = document.createElement('div');
                        div.className = 'user-item';
                        
                        const avatar = document.createElement('div');
                        avatar.className = 'user-avatar';
                        avatar.textContent = req.sender_info.username[0].toUpperCase();
                        
                        const info = document.createElement('div');
                        info.className = 'user-info';
                        
                        const name = document.createElement('div');
                        name.className = 'user-name';
                        name.textContent = req.sender_info.username;
                        
                        const status = document.createElement('div');
                        status.className = 'last-message';
                        status.textContent = 'Хочет добавить вас в друзья';
                        
                        info.appendChild(name);
                        info.appendChild(status);
                        
                        div.appendChild(avatar);
                        div.appendChild(info);
                        
                        const acceptBtn = document.createElement('button');
                        acceptBtn.textContent = '✓';
                        acceptBtn.style.cssText = 'background: #1f66ff; color: #ffffff; border: none; border-radius: 4px; padding: 5px 10px; margin-right: 5px; cursor: pointer;';
                        acceptBtn.onclick = (e) => {
                            e.stopPropagation();
                            acceptRequest(req.id);
                        };
                        
                        const rejectBtn = document.createElement('button');
                        rejectBtn.textContent = '✗';
                        rejectBtn.style.cssText = 'background: #f00; color: #fff; border: none; border-radius: 4px; padding: 5px 10px; cursor: pointer;';
                        rejectBtn.onclick = (e) => {
                            e.stopPropagation();
                            rejectRequest(req.id);
                        };
                        
                        div.appendChild(acceptBtn);
                        div.appendChild(rejectBtn);
                        
                        container.appendChild(div);
                    });
                })
                .catch(error => {
                    console.error('Error loading friend requests:', error);
                });
        }
        
        // Выбор чата
        function selectChat(chatId, chatName, chatType) {
            currentChatId = chatId;
            currentChatName = chatName;
            currentChatType = chatType;
            document.getElementById('sendButton').disabled = false;
            document.getElementById('chatUserName').textContent = chatName;
            document.getElementById('deleteChatBtn').style.display = 'block';
            
            // Показываем кнопку приглашения только для групповых чатов
            if (chatType === 'group') {
                document.getElementById('inviteBtn').style.display = 'inline-block';
            } else {
                document.getElementById('inviteBtn').style.display = 'none';
            }
            
            loadMessages(chatId);
            
            document.querySelectorAll('.user-item').forEach(item => {
                item.classList.remove('active');
            });
            if (event && event.currentTarget) {
                event.currentTarget.classList.add('active');
            }
        }
        
        // Удаление чата
        function deleteChat(chatId, chatName) {
            if (!confirm(`Вы уверены, что хотите удалить чат "${chatName}"?`)) {
                return;
            }
            
            fetch(`/api/chats/${chatId}/delete/`, {
                method: 'DELETE',
                headers: {
                    'X-CSRFToken': getCookie('csrftoken')
                }
            })
            .then(response => response.json())
            .then(data => {
                if (data.error) {
                    alert(data.error);
                } else {
                    alert(data.message);
                    if (currentChatId === chatId) {
                        currentChatId = null;
                        document.getElementById('chatUserName').textContent = 'Выберите чат';
                        document.getElementById('messagesContainer').innerHTML = '<div class="empty-state">Выберите чат, чтобы начать общение</div>';
                        document.getElementById('sendButton').disabled = true;
                        document.getElementById('deleteChatBtn').style.display = 'none';
                        document.getElementById('inviteBtn').style.display = 'none';
                    }
                    loadChats();
                }
            })
            .catch(error => {
                console.error('Error deleting chat:', error);
                alert('Ошибка при удалении чата');
            });
        }
        
        // Удаление текущего чата
        function deleteCurrentChat() {
            if (currentChatId) {
                deleteChat(currentChatId, currentChatName);
            }
        }
        
        // Удаление из друзей
        function removeFriend(userId, username) {
            if (!confirm(`Удалить ${username} из друзей?`)) {
                return;
            }
            
            fetch(`/api/friends/${userId}/remove/`, {
                method: 'DELETE',
                headers: {
                    'X-CSRFToken': getCookie('csrftoken')
                }
            })
            .then(response => response.json())
            .then(data => {
                if (data.error) {
                    alert(data.error);
                } else {
                    alert(data.message);
                    switchTab('friends');
                }
            })
            .catch(error => {
                console.error('Error removing friend:', error);
                alert('Ошибка при удалении из друзей');
            });
        }
        
        // Проверка Enter
        function checkEnter(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }
        
        // Принять заявку
        function acceptRequest(requestId) {
            fetch(`/friend-request/accept/${requestId}/`, {
                method: 'POST',
                headers: {
                    'X-CSRFToken': getCookie('csrftoken')
                }
            }).then(() => {
                switchTab('friends');
            });
        }
        
        // Отклонить заявку
        function rejectRequest(requestId) {
            fetch(`/friend-request/decline/${requestId}/`, {
                method: 'POST',
                headers: {
                    'X-CSRFToken': getCookie('csrftoken')
                }
            }).then(() => {
                switchTab('requests');
            });
        }
        
        // Открыть приватный чат
        function openPrivateChat(userId) {
            console.log('Открываем чат с пользователем ID:', userId);
            
            // Показываем индикатор загрузки
            document.getElementById('userList').style.opacity = '0.5';
            
            // Создаем или открываем чат с этим пользователем
            fetch('/api/chats/create/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCookie('csrftoken')
                },
                body: JSON.stringify({
                    type: 'private',
                    users: [userId]
                })
            })
            .then(response => response.json())
            .then(data => {
                document.getElementById('userList').style.opacity = '1';
                
                if (data.error) {
                    console.error('Ошибка создания чата:', data.error);
                    alert('Ошибка при открытии чата');
                    return;
                }
                
                console.log('Чат получен/создан:', data);
                
                // Переключаемся на вкладку чатов
                switchTab('chats');
                
                // Выбираем созданный/существующий чат
                if (data.id) {
                    // Небольшая задержка, чтобы список чатов успел загрузиться
                    setTimeout(() => {
                        selectChat(data.id, data.name || 'Чат', 'private');
                    }, 300);
                }
            })
            .catch(error => {
                document.getElementById('userList').style.opacity = '1';
                console.error('Error creating chat:', error);
                alert('Ошибка при открытии чата');
            });
        }
        
        // Переключение вкладок
        function switchTab(tab) {
            document.getElementById('chatsTab').classList.remove('active');
            document.getElementById('friendsTab').classList.remove('active');
            document.getElementById('requestsTab').classList.remove('active');
            document.getElementById(tab + 'Tab').classList.add('active');
            
            if (tab === 'chats') {
                loadChats();
            } else if (tab === 'friends') {
                loadFriends();
            } else if (tab === 'requests') {
                loadFriendRequests();
            }
        }
        
        // Поиск пользователей
        function searchUsers() {
            const query = document.getElementById('searchInput').value.trim();
            
            if (query.length < 2) {
                switchTab('chats');
                return;
            }
            
            fetch(`/api/users/search/?q=${encodeURIComponent(query)}`)
                .then(response => response.json())
                .then(users => {
                    const container = document.getElementById('userList');
                    container.innerHTML = '';
                    
                    if (users.length === 0) {
                        container.innerHTML = '<div class="empty-state">Ничего не найдено</div>';
                        return;
                    }
                    
                    users.forEach(user => {
                        const div = document.createElement('div');
                        div.className = 'user-item';
                        
                        const avatar = document.createElement('div');
                        avatar.className = 'user-avatar';
                        avatar.textContent = user.username[0].toUpperCase();
                        
                        const info = document.createElement('div');
                        info.className = 'user-info';
                        
                        const name = document.createElement('div');
                        name.className = 'user-name';
                        name.textContent = user.username;
                        
                        const fullName = document.createElement('div');
                        fullName.className = 'last-message';
                        fullName.textContent = `${user.first_name} ${user.last_name}`.trim() || '@' + user.username;
                        
                        info.appendChild(name);
                        info.appendChild(fullName);
                        
                        div.appendChild(avatar);
                        div.appendChild(info);
                        
                        if (!user.is_friend && !user.has_pending_request) {
                            const addBtn = document.createElement('button');
                            addBtn.textContent = 'Добавить';
                            addBtn.style.cssText = 'background: #1f66ff; color: #ffffff; border: none; border-radius: 4px; padding: 5px 10px; cursor: pointer;';
                            addBtn.onclick = (e) => {
                                e.stopPropagation();
                                sendFriendRequest(user.id);
                            };
                            div.appendChild(addBtn);
                        } else if (user.has_pending_request) {
                            const status = document.createElement('span');
                            status.textContent = 'Запрос отправлен';
                            status.style.cssText = 'color: #ff0; font-size: 12px;';
                            div.appendChild(status);
                        } else {
                            const status = document.createElement('span');
                            status.textContent = 'В друзьях';
                            status.style.cssText = 'color: #1f66ff; font-size: 12px;';
                            div.appendChild(status);
                        }
                        
                        container.appendChild(div);
                    });
                })
                .catch(error => {
                    console.error('Error searching users:', error);
                });
        }
        
        // Отправка заявки в друзья
        function sendFriendRequest(userId) {
            fetch('/api/friend-requests/send/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCookie('csrftoken')
                },
                body: JSON.stringify({receiver_id: userId})
            })
            .then(response => response.json())
            .then(data => {
                if (data.error) {
                    alert(data.error);
                } else {
                    alert('Заявка отправлена!');
                    searchUsers();
                }
            })
            .catch(error => {
                console.error('Error sending friend request:', error);
            });
        }
        
        // Создание приглашения
        function createInvite() {
            if (currentChatId) {
                window.location.href = `/chat/${currentChatId}/invite/create/`;
            }
        }
        
        // Инициализация
        document.addEventListener('DOMContentLoaded', function() {
            setTheme(getPreferredTheme());
            loadChats();
            
            // Проверяем, есть ли параметр chat в URL
            const urlParams = new URLSearchParams(window.location.search);
            const chatId = urlParams.get('chat');
            
            if (chatId) {
                // Ждем загрузки списка чатов и выбираем нужный
                setTimeout(() => {
                    // Ищем элемент с нужным chatId в списке
                    const chatItems = document.querySelectorAll('.user-item');
                    for (let item of chatItems) {
                        if (item.dataset.chatId == chatId) {
                            item.click();
                            break;
                        }
                    }
                }, 500);
            }
            
            refreshInterval = setInterval(function() {
                if (currentChatId) {
                    loadMessages(currentChatId);
                }
                loadChats();
            }, 3000);
        });

        document.addEventListener('click', function(event) {
            const menu = document.getElementById('settingsMenu');
            const btn = document.getElementById('settingsBtn');
            if (!menu || !btn) return;
            if (menu.classList.contains('show') && !menu.contains(event.target) && event.target !== btn) {
                menu.classList.remove('show');
            }
        });
        
        window.addEventListener('beforeunload', function() {
            if (refreshInterval) {
                clearInterval(refreshInterval);
            }
        });
    </script>
</body>
</html>
